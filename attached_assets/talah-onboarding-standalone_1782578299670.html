  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-skip{ color:var(--muteLight); } .light .ob-skip{ color:var(--mute); }\n  .ob-back{ width:38px; height:38px; border-radius:50%; border:none; cursor:pointer; display:grid; place-items:center;\n    background:rgba(0,0,0,0.04); }\n  .dark .ob-back{ background:rgba(255,255,255,0.10); }\n  .ob-back svg{ width:18px; height:18px; }\n  .ob-back[hidden]{ display:none; }\n\n  /* content regions */\n  .ob-body{ flex:1; display:flex; flex-direction:column; padding:74px 34px 0; }\n  .ob-art{ flex:1; display:flex; align-items:center; justify-content:center; min-height:150px; padding:14px 0; }\n  .ob-art svg, .ob-art .card{ max-width:100%; height:auto; }\n  .ob-copy{ padding-bottom:6px; }\n  .kick{ font-family:var(--lt); font-size:11px; font-weight:500; letter-spacing:3px; text-transform:uppercase; direction:ltr; }\n  .light .kick{ color:var(--olive); opacity:.6; } .dark .kick{ color:var(--gold); opacity:.85; }\n  .head{ font-family:var(--ar); font-weight:700; margin:0; line-height:1.28; font-size:clamp(26px,7vw,34px); }\n  .light .head{ color:var(--ink); } .dark .head{ color:var(--soft); }\n  .body{ font-family:var(--ar); font-weight:400; margin:16px 0 0; line-height:1.7; font-size:clamp(15px,4.2vw,17px); }\n  .light .body{ color:var(--mute); } .dark .body{ color:rgba(250,250,248,.85); }\n\n  /* step badge */\n  .step{ display:flex; align-items:center; justify-content:flex-end; gap:14px; flex-direction:row-reverse; }\n  .step .num{ width:44px; height:44px; border-radius:22px; background:var(--olive); display:grid; place-items:center;\n    font-family:var(--lt); font-size:18px; font-weight:600; color:var(--gold); direction:ltr; }\n\n  /* footer: dots + cta */\n  .ob-foot{ padding:18px 34px max(30px, env(safe-area-inset-bottom)); }\n  .dots{ display:flex; gap:7px; justify-content:center; padding:6px 0 4px; direction:ltr; }\n  .dot{ width:6px; height:6px; border-radius:4px; transition:width .3s, background .3s; }\n  .light .dot{ background:rgba(61,74,46,.22); } .light .dot.on{ backg 2 9 18\"><\u002Fpolyline><\u002Fsvg><\u002Fbutton><button class=\"ob-skip\" data-skip=\"\">تخطّي<\u002Fbutton><\u002Fdiv>\n        <div class=\"ob-body\">\n          <div class=\"kick\">01 / Why Tal'ah<\u002Fdiv>\n          <div class=\"ob-art\">\n            <svg width=\"200\" height=\"200\" viewBox=\"0 0 220 220\"><circle cx=\"110\" cy=\"110\" r=\"58\" fill=\"#ece4d3\" opacity=\"0.5\"><\u002Fcircle><circle cx=\"110\" cy=\"110\" r=\"58\" fill=\"none\" stroke=\"#3d4a2e\" stroke-width=\"2\" opacity=\"0.7\"><\u002Fcircle><circle cx=\"110\" cy=\"24\" r=\"16\" fill=\"#3d4a2e\"><\u002Fcircle><circle cx=\"196\" cy=\"110\" r=\"16\" fill=\"#3d4a2e\"><\u002Fcircle><circle cx=\"110\" cy=\"196\" r=\"16\" fill=\"#3d4a2e\"><\u002Fcircle><circle cx=\"24\" cy=\"110\" r=\"16\" fill=\"#3d4a2e\"><\u002Fcircle><circle cx=\"110\" cy=\"110\" r=\"6\" fill=\"#c8a84b\"><\u002Fcircle><\u002Fsvg>\n          <\u002Fdiv>\n          <div class=\"ob-copy\" style=\"text-align:right\">\n            <h1 class=\"head\">الصداقة ما تجي صدفة.<\u002Fh1>\n            <p class=\"body\">مع الوقت تصير اللقاءات الجديدة أصعب. طلعة تختار لك الناس اللي يناسبونك، وتتكفّل بالباقي.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ob-foot\">\n          <div class=\"dots\" data-dots=\"\"><\u002Fdiv>\n          <button class=\"cta\" data-next=\"\">كيف نعمل؟<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 03 · Step 1 -->\n      <section class=\"ob-slide light\" data-screen=\"step1\">\n        <div class=\"ob-bar\"><button class=\"ob-back\" data-back=\"\" aria-label=\"رجوع\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"9 6 15 12 9 18\"><\u002Fpolyline><\u002Fsvg><\u002Fbutton><button class=\"ob-skip\" data-skip=\"\">تخطّي<\u002Fbutton><\u002Fdiv>\n        <div class=\"ob-body\">\n          <div class=\"step\"><div class=\"num\">1<\u002Fdiv><div class=\"kick\">Step 0       <p class=\"body\">مجموعة صغيرة تشبهك في الاهتمامات. مجموعات رجال أو نساء فقط — بدون أسماء ولا صور، إلى أن تلتقون.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ob-foot\">\n          <div class=\"dots\" data-dots=\"\"><\u002Fdiv>\n          <button class=\"cta\" data-next=\"\">التالي<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 05 · Step 3 -->\n      <section class=\"ob-slide light\" data-screen=\"step3\">\n        <div class=\"ob-bar\"><button class=\"ob-back\" data-back=\"\" aria-label=\"رجوع\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"9 6 15 12 9 18\"><\u002Fpolyline><\u002Fsvg><\u002Fbutton><button class=\"ob-skip\" data-skip=\"\">تخطّي<\u002Fbutton><\u002Fdiv>\n        <div class=\"ob-body\">\n          <div class=\"step\"><div class=\"num\">3<\u002Fdiv><div class=\"kick\">Step 03 of 03<\u002Fdiv><\u002Fdiv>\n          <div class=\"ob-art\">\n            <div class=\"venue\">\n              <div style=\"height:160px;position:relative\">\n                <img src=\"a5844bfc-d9c7-42ee-990a-c88a4e621031\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block\">\n                <div style=\"position:absolute;top:14px;left:14px;padding:5px 10px;border-radius:99px;background:var(--gold);color:var(--oliveDeep);font-family:var(--lt);font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase\">Curated<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding:16px 18px;text-align:right\">\n                <div style=\"font-size:17px;font-weight:700;color:var(--ink)\">طاولة مخصّصة لك<\u002Fdiv>\n                <div style=\"margin-top:6px;font-size:13px;color:var(--mute)\">السبت ٧:٣٠ مساءً · ٤ أشخاص<\u002Fdiv>\n                <div style=\"margin-top:12px;display:flex;gap:8px;justify-content:flex-end\">\n                  <span class=\"chip\" style=\"font-size:12px;padding:4px 10px;background:var(--sandDeep);color:var(--olive)\">عشاء<\u002Fspan>\n                  <span class=\"chip\" style=\"font-size:12px;padding:4px 10px;background:var(--sandDeep);color:var(--olive)\">خاص<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"ob-copy\" style=\"text-align:right\">\n            <h1 class=\"head\" style=\"font-size:clamp(23px,6vw,28px)\">نحجز الطاولة، وما عليك إلا الحضور.<\u002Fh1>\n            <p class=\"body\">مكان منتقى، ووقت مناسب لك— بدون تنسيق من قبلك<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ob-foot\">\n          <div class=\"dots\" data-dots=\"\"><\u002Fdiv>\n          <button class=\"cta\" data-next=\"\">التالي<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 06 · Privacy -->\n      <section class=\"ob-slide dark\" data-screen=\"privacy\">\n        <svg class=\"bgrings\" viewBox=\"0 0 390 844\" preserveAspectRatio=\"xMidYMid slice\" style=\"opacity:.08\"><circle cx=\"195\" cy=\"280\" r=\"200\" fill=\"none\" stroke=\"#c8a84b\" stroke-width=\"1\"><\u002Fcircle><circle cx=\"195\" cy=\"280\" r=\"140\" fill=\"none\" stroke=\"#c8a84b\" stroke-width=\"1\"><\u002Fcircle><\u002Fsvg>\n        <div class=\"ob-bar\"><button class=\"ob-back\" data-back=\"\" aria-label=\"رجوع\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fafaf8\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"9 6 15 12 9 18\"><\u002Fpolyline><\u002Fsvg><\u002Fbutton><button class=\"ob-skip\" data-skip=\"\">تخطّي<\u002Fbutton><\u002Fdiv>\n        <div class=\"ob-body\">\n          <div class=\"kick\">Privacy by design<\u002Fdiv>\n          <div class=\"ob-art\" style=\"flex:0;padding:24px 0\">\n            <svg width=\"150\" height=\"150\" viewBox=\"0 0 160 160\"><rect x=\"34\" y=\"68\" width=\"92\" height=\"74\" rx=\"14\" fill=\"none\" stroke=\"#c8a84b\" stroke-width=\"3\"><\u002Frect><path d=\"M 56 68 L 56 50 a 24 24 0 0 1 48 0 L 104 68\" fill=\"none\" stroke=\"#c8a84b\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"80\" cy=\"100\" r=\"7\" fill=\"#c8a84b\"><\u002Fcircle><rect x=\"77\" y=\"104\" width=\"6\" height=\"18\" rx=\"3\" fill=\"#c8a84b\"><\u002Frect><\u002Fsvg>\n          <\u002Fdiv>\n          <div class=\"ob-copy\" style=\"text-align:right;flex:1\">\n            <h1 class=\"head\">خصوصيتك أول شي.<\u002Fh1>\n            <div style=\"margin-top:22px\">\n              <div class=\"bullet\"><i><\u002Fi><span>لا بروفايل عام — أبداً.<\u002Fspan><\u002Fdiv>\n              <div class=\"bullet\"><i><\u002Fi><span>بدون اسم ظاهر، وبدون صور علنية.<\u002Fspan><\u002Fdiv>\n              <div class=\"bullet\"><i><\u002Fi><span>مجموعات رجال أو نساء فقط.<\u002Fspan><\u002Fdiv>\n              <div class=\"bullet\"><i><\u002Fi><span>تفاصيل اللقاء تظهر قبل ٢٤ ساعة فقط.<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ob-foot\">\n          <div class=\"dots\" data-dots=\"\"><\u002Fdiv>\n          <button class=\"cta\" data-next=\"\">التالي<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 07 · Reserve -->\n      <section class=\"ob-slide light\" data-screen=\"reserve\">\n        <div class=\"ob-bar\"><button class=\"ob-back\" data-back=\"\" aria-label=\"رجوع\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"9 6 15 12 9 18\"><\u002Fpolyline><\u002Fsvg><\u002Fbutton><span><\u002Fspan><\u002Fdiv>\n        <div class=\"ob-body\">\n          <div class=\"kick\">Almost there<\u002Fdiv>\n          <div class=\"ob-art\">\n            <svg width=\"200\" height=\"200\" viewBox=\"0 0 200 200\"><path d=\"M 50 100 L 50 140 Q 50 165 75 165 L 115 165 Q 140 165 140 140 L 140 100 Z\" fill=\"#3d4a2e\"><\u002Fpath><path d=\"M 140 110 Q 168 110 168 130 Q 168 150 140 150\" fill=\"none\" stroke=\"#3d4a2e\" stroke-width=\"9\" stroke-linecap=\"round\"><\u002Fpath><rect x=\"35\" y=\"172\" width=\"120\" height=\"9\" rx=\"4\" fill=\"#3d4a2e\"><\u002Frect><path d=\"M 95 80 Q 87 65 95 50 Q 103 35 95 22\" fill=\"none\" stroke=\"#c8a84b\" stroke-width=\"6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div class=\"ob-copy\" style=\"text-align:right\">\n            <h1 class=\"head\">احجز مكانك، والباقي علينا.<\u002Fh1>\n            <p class=\"body\">سجّل حسابك في قائمة الانتظار، وكون معنا في مرحلة الانطلاق.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ob-foot\">\n          <div class=\"dots\" data-dots=\"\"><\u002Fdiv>\n          <button class=\"cta\" data-finish=\"\">احجز مكانك<\u002Fbutton>\n          <div class=\"sec\">بمتابعتك فإنك توافق على الشروط والأحكام<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n(function(){\n  var track  = document.getElementById('track');\n  var slides = Array.prototype.slice.call(track.children);\n  var N = slides.length;\n  var i = 0;\n\n  // build dots in each slide\n  slides.forEach(function(s){\n    var holder = s.querySelector('[data-dots]');\n    for (var k=0;k<N;k++){ var d=document.createElement('span'); d.className='dot'; holder.appendChild(d); }\n  });\n\n  function emit(type, detail){\n    var ev = { type:type, detail:detail||{} };\n    window.dispatchEvent(new CustomEvent('talah-onboarding', { detail: ev }));\n    if (window.parent && window.parent !== window) {\n      window.parent.postMessage({ source:'talah-onboarding', type:type, index:i }, '*');\n    }\n  }\n\n  function render(){\n    track.style.transform = 'translateX(' + (-i * 100) + '%)';\n    slides.forEach(function(s, idx){\n      var dots = s.querySelectorAll('[data-dots] .dot');\n      dots.forEach(function(d,k){ d.classList.toggle('on', k===i); });\n      var back = s.querySelector('[data-back]');\n      if (back) back.hidden = (i===0);\n    });\n    emit('change', { index:i, screen: slides[i].getAttribute('data-screen') });\n  }\n\n  function go(n){ i = Math.max(0, Math.min(N-1, n)); render(); }\n  function next(){ if (i < N-1) go(i+1); else finish(); }\n  function back(){ go(i-1); }\n  function skip(){ emit('skip', { index:i }); go(N-1); }\n  function finish(){ emit('complete', {}); }\n  function login(){ emit('login', {}); }\n\n  // wire buttons (delegate)\n  track.addEventListener('click', function(e){\n    var t = e.target.closest('[data-next],[data-back],[data-skip],[data-finish],[data-login]');\n    if (!t) return;\n    if (t.hasAttribute('data-next'))   next();\n    else if (t.hasAttribute('data-back'))  back();\n    else if (t.hasAttribute('data-skip'))  skip();\n    else if (t.hasAttribute('data-finish')) finish();\n    else if (t.hasAttribute('data-login')) login();\n  });\n\n  // keyboard\n  window.addEventListener('keydown', function(e){\n    if (e.key==='ArrowLeft')  next();   // visual \"forward\" in this LTR track\n    if (e.key==='ArrowRight') back();\n  });\n\n  // swipe (horizontal). swipe toward the left edge => advance\n  var x0=null, y0=null, dragging=false;\n  track.addEventListener('touchstart', function(e){ x0=e.touches[0].clientX; y0=e.touches[0].clientY; dragging=true; }, {passive:true});\n  track.addEventListener('touchend', function(e){\n    if(!dragging) return; dragging=false;\n    var dx=e.changedTouches[0].clientX - x0, dy=e.changedTouches[0].clientY - y0;\n    if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy)) return;\n    if (dx < 0) next(); else back();\n  }, {passive:true});\n\n  // public API for host apps\n  window.TalahOnboarding = {\n    next:next, back:back, skip:skip, goTo:go, finish:finish,\n    get index(){ return i; },\n    on:function(cb){ window.addEventListener('talah-onboarding', function(e){ cb(e.detail); }); }\n  };\n\n  render();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
